<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#172033">

<title>P&M Knowledge Hub</title>


<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #eef2f6;
  color: #172033;
}


/* HEADER */

.header {
  background: #172033;
  color: white;
  text-align: center;
  padding: 27px 15px;
}

.logo {
  font-size: 27px;
  font-weight: 800;
}

.subtitle {
  margin-top: 7px;
  color: #cbd5e1;
  font-size: 14px;
}


/* MAIN */

.container {
  width: 94%;
  max-width: 680px;
  margin: 25px auto;
}


/* CARD */

.card {
  background: white;
  border-radius: 18px;
  padding: 25px;
  box-shadow: 0 6px 25px rgba(0,0,0,0.08);
}

.section-title {
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 22px;
}


/* FORM */

label {
  display: block;
  margin-top: 18px;
  margin-bottom: 8px;
  font-size: 14px;
  font-weight: 700;
}

select {
  width: 100%;
  padding: 15px;
  border: 1px solid #d5dbe3;
  border-radius: 11px;
  background: white;
  font-size: 16px;
  color: #172033;
}

select:disabled {
  background: #f1f4f7;
  color: #8b95a5;
}


/* EQUIPMENT INFO */

.equipment-card {
  display: none;
  margin-top: 22px;
  padding: 18px;
  border-radius: 13px;
  background: #f4f6f9;
  border: 1px solid #e4e8ee;
}

.equipment-name {
  font-size: 21px;
  font-weight: 800;
}

.equipment-model {
  margin-top: 7px;
  font-size: 15px;
  color: #64748b;
}


/* START BUTTON */

.start-button {
  width: 100%;
  margin-top: 25px;
  padding: 16px;
  border: none;
  border-radius: 12px;
  background: #172033;
  color: white;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
}

.start-button:disabled {
  background: #9aa1ab;
}


/* RESULT */

.result {
  display: none;
  text-align: center;
}

.success-icon {
  width: 55px;
  height: 55px;
  margin: 0 auto 15px;
  border-radius: 50%;
  background: #e8f5ec;
  color: #16803a;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: 800;
}

.result-title {
  font-size: 23px;
  font-weight: 800;
}

.result-description {
  margin: 15px 0 22px;
  line-height: 1.7;
  color: #64748b;
}


/* NOTEBOOK BUTTON */

.notebook-button {
  display: block;
  width: 100%;
  padding: 16px;
  border-radius: 12px;
  background: #172033;
  color: white;
  text-decoration: none;
  font-size: 16px;
  font-weight: 800;
}


/* BACK BUTTON */

.back-button {
  width: 100%;
  margin-top: 12px;
  padding: 13px;
  border: 1px solid #d5dbe3;
  border-radius: 11px;
  background: white;
  color: #172033;
  font-weight: 700;
  cursor: pointer;
}


/* MESSAGE */

.message {
  display: none;
  margin-top: 18px;
  padding: 13px;
  border-radius: 10px;
  background: #fff4e5;
  color: #8a5200;
}


/* MOBILE */

@media(max-width:600px) {

  .logo {
    font-size: 23px;
  }

  .container {
    width: 94%;
  }

  .card {
    padding: 20px;
  }

  select {
    padding: 16px;
    font-size: 16px;
  }

}

</style>

</head>


<body>


<header class="header">

  <div class="logo">
    ⚙ P&M KNOWLEDGE HUB
  </div>

  <div class="subtitle">
    Equipment Knowledge Portal
  </div>

</header>


<main class="container">


<section class="card" id="selectionCard">

  <div class="section-title">
    Select Equipment
  </div>


  <label>
    Equipment
  </label>

  <select id="equipment">

    <option value="">
      Connecting...
    </option>

  </select>


  <label>
    Make / Manufacturer
  </label>

  <select id="make" disabled>

    <option value="">
      Select equipment first
    </option>

  </select>


  <label>
    Model
  </label>

  <select id="model" disabled>

    <option value="">
      Select make first
    </option>

  </select>


  <div
    class="equipment-card"
    id="equipmentCard"
  >

    <div
      class="equipment-name"
      id="equipmentName"
    ></div>

    <div
      class="equipment-model"
      id="equipmentModel"
    ></div>

  </div>


  <div
    class="message"
    id="message"
  ></div>


  <button
    class="start-button"
    id="startButton"
    disabled
  >

    🚀 START ASSISTANCE

  </button>

</section>


<section
  class="card result"
  id="resultCard"
>

  <div class="success-icon">
    ✓
  </div>

  <div class="result-title">
    Equipment Selected
  </div>

  <div
    class="result-description"
    id="resultDescription"
  ></div>

  <a
    id="notebookButton"
    class="notebook-button"
    href="#"
    target="_blank"
    rel="noopener"
  >

    🔗 OPEN NOTEBOOK

  </a>

  <button
    class="back-button"
    id="backButton"
  >

    ← SELECT ANOTHER EQUIPMENT

  </button>

</section>


</main>


<footer
  style="
    text-align:center;
    padding:20px;
    color:#8a94a3;
    font-size:11px;
  "
>

  P&M Department • Knowledge Hub

</footer>


<script>

/* =========================================================
   GOOGLE APPS SCRIPT URL
   ========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbxJIiu9XgpnoxL9TrbQyOLJufQUd1dDFJuJuN8QUrr12pjvj403sGUoi5Zhjv07qy2v/exec";


/* =========================================================
   VARIABLES
   ========================================================= */

let equipmentData = [];

let selectedEquipment = null;


/* =========================================================
   ELEMENTS
   ========================================================= */

const equipmentSelect =
  document.getElementById("equipment");

const makeSelect =
  document.getElementById("make");

const modelSelect =
  document.getElementById("model");

const equipmentCard =
  document.getElementById("equipmentCard");

const equipmentName =
  document.getElementById("equipmentName");

const equipmentModel =
  document.getElementById("equipmentModel");

const startButton =
  document.getElementById("startButton");

const message =
  document.getElementById("message");

const selectionCard =
  document.getElementById("selectionCard");

const resultCard =
  document.getElementById("resultCard");

const resultDescription =
  document.getElementById("resultDescription");

const notebookButton =
  document.getElementById("notebookButton");

const backButton =
  document.getElementById("backButton");


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text) {

  message.textContent = text;

  message.style.display = "block";

}


function clearMessage() {

  message.textContent = "";

  message.style.display = "none";

}


/* =========================================================
   LOAD DATA
   ========================================================= */

function loadEquipmentData() {

  equipmentSelect.innerHTML =
    '<option value="">Connecting...</option>';

  equipmentSelect.disabled = true;

  clearMessage();


  const callbackName =
    "PMKnowledgeHub_" + Date.now();


  let finished = false;

  let script = null;


  function cleanup() {

    try {

      delete window[callbackName];

    }

    catch (e) {}


    if (
      script &&
      script.parentNode
    ) {

      script.parentNode.removeChild(script);

    }

  }


  window[callbackName] =
    function(data) {

      if (finished) return;

      finished = true;


      console.log(
        "P&M Knowledge Hub response:",
        data
      );


      try {

        if (
          !Array.isArray(data)
        ) {

          throw new Error(
            "Invalid data received from Apps Script."
          );

        }


        equipmentData = data;


        if (
          equipmentData.length === 0
        ) {

          equipmentSelect.innerHTML =
            '<option value="">No equipment found</option>';

          showMessage(
            "No equipment records were found in Equipment Master."
          );

          cleanup();

          return;

        }


        populateEquipment();

      }

      catch(error) {

        console.error(
          "Data processing error:",
          error
        );


        equipmentSelect.innerHTML =
          '<option value="">Data error</option>';


        showMessage(
          "Equipment data could not be processed."
        );

      }


      cleanup();

    };


  script =
    document.createElement("script");


  script.src =
    API_URL +
    "?action=data" +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&_=" +
    Date.now();


  script.async = true;


  script.onerror =
    function() {

      if (finished) return;

      finished = true;


      console.error(
        "Unable to connect to Apps Script."
      );


      equipmentSelect.innerHTML =
        '<option value="">Connection failed</option>';


      equipmentSelect.disabled = true;


      showMessage(
        "Unable to connect to P&M Knowledge Hub. Check Apps Script deployment."
      );


      cleanup();

    };


  document.body.appendChild(script);


  setTimeout(
    function() {

      if (finished) return;

      finished = true;


      console.error(
        "Apps Script request timed out."
      );


      equipmentSelect.innerHTML =
        '<option value="">Connection timeout</option>';


      equipmentSelect.disabled = true;


      showMessage(
        "P&M Knowledge Hub did not respond. Check Apps Script deployment."
      );


      cleanup();

    },
    15000
  );

}


/* =========================================================
   POPULATE EQUIPMENT
   ========================================================= */

function populateEquipment() {

  equipmentSelect.innerHTML =
    '<option value="">Select equipment</option>';

  equipmentSelect.disabled = false;


  const types = [];


  equipmentData.forEach(
    function(item) {

      const type =
        String(
          item.equipment || ""
        ).trim();


      if (
        type &&
        !types.includes(type)
      ) {

        types.push(type);

      }

    }
  );


  types.sort();


  types.forEach(
    function(type) {

      const option =
        document.createElement(
          "option"
        );


      option.value = type;

      option.textContent = type;


      equipmentSelect.appendChild(
        option
      );

    }
  );

}


/* =========================================================
   EQUIPMENT CHANGE
   ========================================================= */

equipmentSelect.addEventListener(
  "change",
  function() {

    const selected =
      this.value;


    resetMake();

    resetModel();

    resetEquipmentCard();

    clearMessage();


    if (!selected) return;


    const makes = [];


    equipmentData.forEach(
      function(item) {

        const itemEquipment =
          String(
            item.equipment || ""
          )
          .trim()
          .toUpperCase();


        const selectedEquipment =
          String(selected)
          .trim()
          .toUpperCase();


        const make =
          String(
            item.make || ""
          ).trim();


        if (
          itemEquipment ===
            selectedEquipment
          &&
          make
          &&
          !makes.includes(make)
        ) {

          makes.push(make);

        }

      }
    );


    makes.sort();


    makeSelect.innerHTML =
      '<option value="">Select make</option>';


    makes.forEach(
      function(make) {

        const option =
          document.createElement(
            "option"
          );


        option.value = make;

        option.textContent = make;


        makeSelect.appendChild(
          option
        );

      }
    );


    if (
      makes.length > 0
    ) {

      makeSelect.disabled =
        false;

    }

    else {

      makeSelect.innerHTML =
        '<option value="">No make found</option>';

      makeSelect.disabled =
        true;

    }

  }
);


/* =========================================================
   MAKE CHANGE
   ========================================================= */

makeSelect.addEventListener(
  "change",
  function() {

    const equipment =
      equipmentSelect.value;

    const selectedMake =
      this.value;


    resetModel();

    resetEquipmentCard();

    clearMessage();


    if (
      !equipment ||
      !selectedMake
    ) {

      return;

    }


    const models = [];


    equipmentData.forEach(
      function(item) {

        const itemEquipment =
          String(
            item.equipment || ""
          )
          .trim()
          .toUpperCase();


        const itemMake =
          String(
            item.make || ""
          )
          .trim()
          .toUpperCase();


        if (
          itemEquipment ===
            String(equipment)
              .trim()
              .toUpperCase()
          &&
          itemMake ===
            String(selectedMake)
              .trim()
              .toUpperCase()
        ) {

          models.push(item);

        }

      }
    );


    modelSelect.innerHTML =
      '<option value="">Select model</option>';


    models.forEach(
      function(item) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          item.model;


        option.textContent =
          item.model;


        modelSelect.appendChild(
          option
        );

      }
    );


    if (
      models.length > 0
    ) {

      modelSelect.disabled =
        false;

    }

    else {

      modelSelect.innerHTML =
        '<option value="">No model found</option>';

      modelSelect.disabled =
        true;

    }

  }
);


/* =========================================================
   MODEL CHANGE
   ========================================================= */

modelSelect.addEventListener(
  "change",
  function() {

    const equipment =
      equipmentSelect.value;

    const make =
      makeSelect.value;

    const model =
      this.value;


    clearMessage();

    resetEquipmentCard();


    selectedEquipment =
      equipmentData.find(
        function(item) {

          return (

            String(
              item.equipment || ""
            )
            .trim()
            .toUpperCase()
            ===
            String(equipment)
              .trim()
              .toUpperCase()

            &&

            String(
              item.make || ""
            )
            .trim()
            .toUpperCase()
            ===
            String(make)
              .trim()
              .toUpperCase()

            &&

            String(
              item.model || ""
            )
            .trim()
            .toUpperCase()
            ===
            String(model)
              .trim()
              .toUpperCase()

          );

        }
      );


    if (
      !selectedEquipment
    ) {

      startButton.disabled =
        true;

      return;

    }


    equipmentName.textContent =
      selectedEquipment.equipment;


    equipmentModel.textContent =
      selectedEquipment.make +
      " • " +
      selectedEquipment.model;


    equipmentCard.style.display =
      "block";


    startButton.disabled =
      false;

  }
);


/* =========================================================
   START ASSISTANCE
   ========================================================= */

startButton.addEventListener(
  "click",
  function() {

    if (
      !selectedEquipment
    ) {

      return;

    }


    const notebookLink =
      String(
        selectedEquipment.notebookLink || ""
      ).trim();


    if (
      !notebookLink ||
      notebookLink
        .toLowerCase()
        .includes("paste notebook")
    ) {

      showMessage(
        "NotebookLM link has not been added for this equipment."
      );

      return;

    }


    startButton.disabled =
      true;


    startButton.textContent =
      "⏳ OPENING NOTEBOOK...";


    resultDescription.innerHTML =

      "<strong>" +

      escapeHtml(
        selectedEquipment.equipment
      ) +

      "</strong><br>" +

      escapeHtml(
        selectedEquipment.make
      ) +

      " • " +

      escapeHtml(
        selectedEquipment.model
      ) +

      "<br><br>" +

      "Knowledge Notebook: " +

      escapeHtml(
        selectedEquipment.notebookName ||
        "Equipment Notebook"
      );


    notebookButton.href =
      notebookLink;


    selectionCard.style.display =
      "none";


    resultCard.style.display =
      "block";


    startButton.disabled =
      false;


    startButton.textContent =
      "🚀 START ASSISTANCE";

  }
);


/* =========================================================
   BACK BUTTON
   ========================================================= */

backButton.addEventListener(
  "click",
  function() {

    resultCard.style.display =
      "none";


    selectionCard.style.display =
      "block";


    equipmentSelect.value =
      "";


    resetMake();

    resetModel();

    resetEquipmentCard();

    clearMessage();

  }
);


/* =========================================================
   RESET MAKE
   ========================================================= */

function resetMake() {

  makeSelect.innerHTML =
    '<option value="">Select equipment first</option>';

  makeSelect.disabled =
    true;

}


/* =========================================================
   RESET MODEL
   ========================================================= */

function resetModel() {

  modelSelect.innerHTML =
    '<option value="">Select make first</option>';

  modelSelect.disabled =
    true;

}


/* =========================================================
   RESET EQUIPMENT CARD
   ========================================================= */

function resetEquipmentCard() {

  equipmentCard.style.display =
    "none";


  startButton.disabled =
    true;


  selectedEquipment =
    null;

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value) {

  return String(
    value || ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================================================
   START APPLICATION
   ========================================================= */

loadEquipmentData();

</script>


</body>

</html>
