<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#172033">

<title>P&M Knowledge Hub</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #eef2f6;
  color: #172033;
}

.header {
  background: #172033;
  color: white;
  text-align: center;
  padding: 27px 15px;
}

.logo {
  font-size: 27px;
  font-weight: 800;
}

.subtitle {
  margin-top: 7px;
  color: #cbd5e1;
  font-size: 14px;
}

.container {
  width: 94%;
  max-width: 680px;
  margin: 25px auto;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 25px;
  box-shadow: 0 6px 25px rgba(0,0,0,0.08);
}

.section-title {
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 22px;
}

label {
  display: block;
  margin-top: 18px;
  margin-bottom: 8px;
  font-size: 14px;
  font-weight: 700;
}

select {
  width: 100%;
  padding: 15px;
  border: 1px solid #d5dbe3;
  border-radius: 11px;
  background: white;
  font-size: 16px;
  color: #172033;
}

select:disabled {
  background: #f1f4f7;
  color: #8b95a5;
}

.equipment-card {
  display: none;
  margin-top: 22px;
  padding: 18px;
  border-radius: 13px;
  background: #f4f6f9;
  border: 1px solid #e4e8ee;
}

.equipment-name {
  font-size: 21px;
  font-weight: 800;
}

.equipment-model {
  margin-top: 7px;
  font-size: 15px;
  color: #64748b;
}

.start-button {
  width: 100%;
  margin-top: 25px;
  padding: 16px;
  border: none;
  border-radius: 12px;
  background: #172033;
  color: white;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
}

.start-button:disabled {
  background: #9aa1ab;
}

.result {
  display: none;
  text-align: center;
}

.success-icon {
  width: 55px;
  height: 55px;
  margin: 0 auto 15px;
  border-radius: 50%;
  background: #e8f5ec;
  color: #16803a;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: 800;
}

.result-title {
  font-size: 23px;
  font-weight: 800;
}

.result-description {
  margin: 15px 0 22px;
  line-height: 1.7;
  color: #64748b;
}

.notebook-button {
  display: block;
  width: 100%;
  padding: 16px;
  border-radius: 12px;
  background: #172033;
  color: white;
  text-decoration: none;
  font-size: 16px;
  font-weight: 800;
}

.back-button {
  width: 100%;
  margin-top: 12px;
  padding: 13px;
  border: 1px solid #d5dbe3;
  border-radius: 11px;
  background: white;
  color: #172033;
  font-weight: 700;
  cursor: pointer;
}

.message {
  display: none;
  margin-top: 18px;
  padding: 13px;
  border-radius: 10px;
  background: #fff4e5;
  color: #8a5200;
}

@media(max-width:600px) {

  .logo {
    font-size: 23px;
  }

  .container {
    width: 94%;
  }

  .card {
    padding: 20px;
  }

  select {
    padding: 16px;
    font-size: 16px;
  }

}

</style>

</head>

<body>

<header class="header">

  <div class="logo">
    ⚙ P&M KNOWLEDGE HUB
  </div>

  <div class="subtitle">
    Equipment Knowledge Portal
  </div>

</header>

<main class="container">

<section class="card" id="selectionCard">

  <div class="section-title">
    Select Equipment
  </div>

  <label>
    Equipment
  </label>

  <select id="equipment">

    <option value="">
      Connecting...
    </option>

  </select>

  <label>
    Make / Manufacturer
  </label>

  <select id="make" disabled>

    <option value="">
      Select equipment first
    </option>

  </select>

  <label>
    Model
  </label>

  <select id="model" disabled>

    <option value="">
      Select make first
    </option>

  </select>

  <div
    class="equipment-card"
    id="equipmentCard"
  >

    <div
      class="equipment-name"
      id="equipmentName"
    ></div>

    <div
      class="equipment-model"
      id="equipmentModel"
    ></div>

  </div>

  <div
    class="message"
    id="message"
  ></div>

  <button
    class="start-button"
    id="startButton"
    disabled
  >

    🚀 START ASSISTANCE

  </button>

</section>

<section
  class="card result"
  id="resultCard"
>

  <div class="success-icon">
    ✓
  </div>

  <div class="result-title">
    Equipment Selected
  </div>

  <div
    class="result-description"
    id="resultDescription"
  ></div>

  <a
    id="notebookButton"
    class="notebook-button"
    href="#"
    target="_blank"
    rel="noopener"
  >

    🔗 OPEN NOTEBOOK

  </a>

  <button
    class="back-button"
    id="backButton"
  >

    ← SELECT ANOTHER EQUIPMENT

  </button>

</section>

</main>

<footer
  style="
    text-align:center;
    padding:20px;
    color:#8a94a3;
    font-size:11px;
  "
>

  P&M Department • Knowledge Hub

</footer>

<script>

/* =========================================================
   GOOGLE APPS SCRIPT URL
   ========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbxJIiu9XgpnoxL9TrbQyOLJufQUd1dDFJuJuN8QUrr12pjvj403sGUoi5Zhjv07qy2v/exec";


let equipmentData = [];

let selectedEquipment = null;


/* =========================================================
   ELEMENTS
   ========================================================= */

const equipmentSelect =
  document.getElementById("equipment");

const makeSelect =
  document.getElementById("make");

const modelSelect =
  document.getElementById("model");

const equipmentCard =
  document.getElementById("equipmentCard");

const equipmentName =
  document.getElementById("equipmentName");

const equipmentModel =
  document.getElementById("equipmentModel");

const startButton =
  document.getElementById("startButton");

const message =
  document.getElementById("message");

const selectionCard =
  document.getElementById("selectionCard");

const resultCard =
  document.getElementById("resultCard");

const resultDescription =
  document.getElementById("resultDescription");

const notebookButton =
  document.getElementById("notebookButton");

const backButton =
  document.getElementById("backButton");


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text) {

  message.textContent = text;

  message.style.display = "block";

}


function clearMessage() {

  message.textContent = "";

  message.style.display = "none";

}


/* =========================================================
   LOAD EQUIPMENT DATA
   ========================================================= */

function loadEquipmentData() {

  equipmentSelect.innerHTML =
    '<option value="">Connecting...</option>';

  equipmentSelect.disabled = true;

  clearMessage();


  const callbackName =
    "PMKnowledgeHubCallback_" + Date.now();


  let completed = false;

  const script =
    document.createElement("script");


  function cleanup() {

    try {

      delete window[callbackName];

    } catch(e) {}


    if (
      script &&
      script.parentNode
    ) {

      script.parentNode.removeChild(script);

    }

  }


  /*
   * Apps Script returns:
   *
   * PMKnowledgeHubCallback_xxxxx([...data...]);
   */

  window[callbackName] =
    function(data) {

      if (completed) return;

      completed = true;


      console.log(
        "P&M Knowledge Hub data:",
        data
      );


      if (
        !Array.isArray(data)
      ) {

        equipmentSelect.innerHTML =
          '<option value="">Data error</option>';

        showMessage(
          "The Knowledge Hub returned invalid equipment data."
        );

        cleanup();

        return;

      }


      equipmentData =
        data;


      if (
        equipmentData.length === 0
      ) {

        equipmentSelect.innerHTML =
          '<option value="">No equipment found</option>';

        showMessage(
          "No equipment records were found."
        );

        cleanup();

        return;

      }


      populateEquipment();

      cleanup();

    };


  /*
   * IMPORTANT:
   * This is JSONP.
   */

  script.src =
    API_URL +
    "?action=data" +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&v=" +
    Date.now();


  script.async = true;


  script.onerror =
    function() {

      if (completed) return;

      completed = true;


      equipmentSelect.innerHTML =
        '<option value="">Connection failed</option>';

      equipmentSelect.disabled =
        true;


      showMessage(
        "Unable to connect to P&M Knowledge Hub."
      );


      cleanup();

    };


  document.head.appendChild(
    script
  );


  /*
   * Timeout protection
   */

  setTimeout(
    function() {

      if (completed) return;

      completed = true;


      equipmentSelect.innerHTML =
        '<option value="">Connection timeout</option>';

      equipmentSelect.disabled =
        true;


      showMessage(
        "P&M Knowledge Hub took too long to respond."
      );


      cleanup();

    },
    20000
  );

}


/* =========================================================
   POPULATE EQUIPMENT
   ========================================================= */

function populateEquipment() {

  equipmentSelect.innerHTML =
    '<option value="">Select equipment</option>';

  equipmentSelect.disabled =
    false;


  const equipmentList =
    [];


  equipmentData.forEach(
    function(item) {

      const name =
        String(
          item.equipment || ""
        ).trim();


      if (
        name &&
        !equipmentList.includes(name)
      ) {

        equipmentList.push(
          name
        );

      }

    }
  );


  equipmentList.sort();


  equipmentList.forEach(
    function(name) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        name;


      option.textContent =
        name;


      equipmentSelect.appendChild(
        option
      );

    }
  );

}


/* =========================================================
   EQUIPMENT CHANGE
   ========================================================= */

equipmentSelect.addEventListener(
  "change",
  function() {

    const equipment =
      this.value;


    resetMake();

    resetModel();

    resetEquipmentCard();

    clearMessage();


    if (!equipment) return;


    const makes =
      [];


    equipmentData.forEach(
      function(item) {

        const sameEquipment =
          String(
            item.equipment || ""
          )
          .trim()
          .toUpperCase()
          ===
          equipment
            .trim()
            .toUpperCase();


        if (sameEquipment) {

          const make =
            String(
              item.make || ""
            ).trim();


          if (
            make &&
            !makes.includes(make)
          ) {

            makes.push(
              make
            );

          }

        }

      }
    );


    makes.sort();


    makeSelect.innerHTML =
      '<option value="">Select make</option>';


    makes.forEach(
      function(make) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          make;


        option.textContent =
          make;


        makeSelect.appendChild(
          option
        );

      }
    );


    makeSelect.disabled =
      makes.length === 0;


    if (
      makes.length === 0
    ) {

      makeSelect.innerHTML =
        '<option value="">No make found</option>';

    }

  }
);


/* =========================================================
   MAKE CHANGE
   ========================================================= */

makeSelect.addEventListener(
  "change",
  function() {

    const equipment =
      equipmentSelect.value;

    const make =
      this.value;


    resetModel();

    resetEquipmentCard();

    clearMessage();


    if (
      !equipment ||
      !make
    ) return;


    const models =
      [];


    equipmentData.forEach(
      function(item) {

        const sameEquipment =
          String(
            item.equipment || ""
          )
          .trim()
          .toUpperCase()
          ===
          equipment
            .trim()
            .toUpperCase();


        const sameMake =
          String(
            item.make || ""
          )
          .trim()
          .toUpperCase()
          ===
          make
            .trim()
            .toUpperCase();


        if (
          sameEquipment &&
          sameMake
        ) {

          const model =
            String(
              item.model || ""
            ).trim();


          if (model) {

            models.push(
              model
            );

          }

        }

      }
    );


    modelSelect.innerHTML =
      '<option value="">Select model</option>';


    models.forEach(
      function(model) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          model;


        option.textContent =
          model;


        modelSelect.appendChild(
          option
        );

      }
    );


    modelSelect.disabled =
      models.length === 0;


    if (
      models.length === 0
    ) {

      modelSelect.innerHTML =
        '<option value="">No model found</option>';

    }

  }
);


/* =========================================================
   MODEL CHANGE
   ========================================================= */

modelSelect.addEventListener(
  "change",
  function() {

    const equipment =
      equipmentSelect.value;

    const make =
      makeSelect.value;

    const model =
      this.value;


    resetEquipmentCard();

    clearMessage();


    if (
      !equipment ||
      !make ||
      !model
    ) return;


    selectedEquipment =
      equipmentData.find(
        function(item) {

          return (

            String(
              item.equipment || ""
            )
            .trim()
            .toUpperCase()
            ===
            equipment
              .trim()
              .toUpperCase()

            &&

            String(
              item.make || ""
            )
            .trim()
            .toUpperCase()
            ===
            make
              .trim()
              .toUpperCase()

            &&

            String(
              item.model || ""
            )
            .trim()
            .toUpperCase()
            ===
            model
              .trim()
              .toUpperCase()

          );

        }
      );


    if (
      !selectedEquipment
    ) {

      return;

    }


    equipmentName.textContent =
      selectedEquipment.equipment;


    equipmentModel.textContent =
      selectedEquipment.make +
      " • " +
      selectedEquipment.model;


    equipmentCard.style.display =
      "block";


    startButton.disabled =
      false;

  }
);


/* =========================================================
   START ASSISTANCE
   ========================================================= */

startButton.addEventListener(
  "click",
  function() {

    if (
      !selectedEquipment
    ) return;


    const notebookLink =
      String(
        selectedEquipment.notebookLink || ""
      ).trim();


    if (
      !notebookLink ||
      notebookLink
        .toLowerCase()
        .includes("paste notebook")
    ) {

      showMessage(
        "NotebookLM link is not available for this equipment."
      );

      return;

    }


    resultDescription.innerHTML =

      "<strong>" +

      escapeHtml(
        selectedEquipment.equipment
      ) +

      "</strong><br>" +

      escapeHtml(
        selectedEquipment.make
      ) +

      " • " +

      escapeHtml(
        selectedEquipment.model
      ) +

      "<br><br>" +

      "Knowledge Notebook: " +

      escapeHtml(
        selectedEquipment.notebookName ||
        "Equipment Notebook"
      );


    notebookButton.href =
      notebookLink;


    selectionCard.style.display =
      "none";


    resultCard.style.display =
      "block";

  }
);


/* =========================================================
   BACK BUTTON
   ========================================================= */

backButton.addEventListener(
  "click",
  function() {

    resultCard.style.display =
      "none";


    selectionCard.style.display =
      "block";


    equipmentSelect.value =
      "";


    resetMake();

    resetModel();

    resetEquipmentCard();

    clearMessage();

  }
);


/* =========================================================
   RESET MAKE
   ========================================================= */

function resetMake() {

  makeSelect.innerHTML =
    '<option value="">Select equipment first</option>';

  makeSelect.disabled =
    true;

}


/* =========================================================
   RESET MODEL
   ========================================================= */

function resetModel() {

  modelSelect.innerHTML =
    '<option value="">Select make first</option>';

  modelSelect.disabled =
    true;

}


/* =========================================================
   RESET EQUIPMENT CARD
   ========================================================= */

function resetEquipmentCard() {

  equipmentCard.style.display =
    "none";


  startButton.disabled =
    true;


  selectedEquipment =
    null;

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value) {

  return String(
    value || ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================================================
   START APPLICATION
   ========================================================= */

loadEquipmentData();

</script>

</body>

</html>
